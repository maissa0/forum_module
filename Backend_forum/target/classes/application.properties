
spring.application.name=forum-service
spring.data.mongodb.uri=mongodb://localhost:27017/forumdb
spring.data.mongodb.database=forumdb
server.port=8083
spring.security.user.name=admin
spring.security.user.password=admin


# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true

management.endpoint.health.enabled=true


# disable security for actuator endpoints
management.endpoint.health.roles=
management.endpoint.info.roles=

# Logging configuration
logging.level.com.forumapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.mongodb.driver=INFO

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Eureka client configuration

eureka.client.service-url.defaultZone=http://localhost:8070/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
